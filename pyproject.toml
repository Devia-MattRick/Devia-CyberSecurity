[project]
name = "devia-cybersecurity"
version = "0.1.0"
description = "Agnostic cybersecurity analysis scripts and heuristics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Devia-MattRick", email = "devia.devolutioniagentic@gmail.com" }
]
dependencies = [
    "pydantic>=2.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
